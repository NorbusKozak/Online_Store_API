
version: '3.8'

services:
  api:
    build: .
    container_name: fastapi_sklep
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: postgres_database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shop_db
    ports:
    - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
  
volumes:
  postgres_data: